// The peppydb key-value API, version 1.
//
// Errors are gRPC statuses, not fields of the response messages. A call
// that succeeds returns OK and its response message. A call that fails
// returns a status code and a message, and no response message:
//
//   INVALID_ARGUMENT    the request is malformed (an empty key, a key or
//                       value over the server's limits, start after end);
//                       nothing was written.
//   UNAVAILABLE         the server cannot serve the call now, for example
//                       while it shuts down. The outcome of a write is
//                       unknown; retry it.
//   RESOURCE_EXHAUSTED  the request exceeds the server's message size.
//   INTERNAL            a storage error or a server bug. The outcome of a
//                       write is unknown.
//
// A write whose call ends with CANCELLED, DEADLINE_EXCEEDED, UNAVAILABLE,
// or INTERNAL may or may not have taken effect. Put and Delete are
// idempotent, so retrying them is safe.
syntax = "proto3";

package peppydb.kv.v1;

option go_package = "peppydb/go/kvpb;kvpb";

// Reads and writes of single keys, and range scans.
//
// Consistency: operations on one key are linearizable. A Put or Delete
// returns OK only after it is durable: it survives a crash of the server.
// Scans are consistent within one storage leaf, not across leaves or
// pages: a scan that runs while writes happen can see a later write to one
// key and miss an earlier write to another.
service KvService {
  // The value stored for a key. An absent key is not an error: the
  // response has no value.
  rpc Get(GetRequest) returns (GetResponse);
  // Store a value for a key, replacing any earlier value.
  rpc Put(PutRequest) returns (PutResponse);
  // Remove a key. Deleting an absent key succeeds.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // One page of the records in [start, end), in key order. To read a whole
  // range, repeat the request with start set to the previous response's
  // next_start until next_start is unset.
  rpc Scan(ScanRequest) returns (ScanResponse);
}

// Operations on the server itself.
service AdminService {
  // The server's state and version.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Commit a checkpoint of the storage engine now.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
}

message GetRequest {
  // Must not be empty.
  bytes key = 1;
}

message GetResponse {
  // Unset if the key is absent. An empty value is a valid stored value.
  optional bytes value = 1;
}

message PutRequest {
  // Must not be empty.
  bytes key = 1;
  // May be empty.
  bytes value = 2;
}

message PutResponse {}

message DeleteRequest {
  // Must not be empty.
  bytes key = 1;
}

message DeleteResponse {}

message ScanRequest {
  // The first key of the range, inclusive. Unset: from the first key.
  optional bytes start = 1;
  // The end of the range, exclusive. Unset: to the last key.
  optional bytes end = 2;
  // The most records to return in this page. 0, or a value above the
  // server's maximum, returns up to the maximum. A page can hold fewer
  // records than this, also when more records remain.
  uint32 page_size = 3;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message ScanResponse {
  // The records of this page, in key order.
  repeated KeyValue records = 1;
  // Set if more records may remain: the first key not returned. Unset: the
  // range is exhausted.
  optional bytes next_start = 2;
}

message StatusRequest {}

message StatusResponse {
  // Every write with a sequence at or below this is applied.
  uint64 applied_seq = 1;
  // The server's version.
  string version = 2;
}

message CheckpointRequest {}

message CheckpointResponse {
  // Every write at or below this sequence is in the committed checkpoint.
  uint64 applied_seq = 1;
  // Increases by one per committed checkpoint.
  uint64 checkpoint_id = 2;
}
