name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  buck2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Install the pinned components before Buck2 runs. Buck2 runs tests with
      # a minimal environment; a missing component would make rustup install
      # the toolchain inside parallel test actions.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt, rust-src
      - name: Install DotSlash
        run: tools/ci/install-dotslash
      - name: Check formatting
        run: tools/fmt.sh
      - name: Run clippy
        run: tools/clippy.sh
      - name: Run tests
        run: tools/buck2 test //crates/... //bin/...

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install DotSlash
        run: tools/ci/install-dotslash
      - name: Check generated Cargo manifests
        run: tools/autocargo --check
      - name: Run tests
        run: cargo test --workspace --locked
