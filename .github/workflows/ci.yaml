name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  buck2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Install the pinned components before Buck2 runs. Buck2 runs tests with
      # a minimal environment; a missing component would make rustup install
      # the toolchain inside parallel test actions.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt, rust-src
      # Buck2's Go toolchain uses `go` from PATH; go/go.mod pins the version.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Install DotSlash
        run: tools/ci/install-dotslash
      - name: Check formatting
        run: tools/fmt.sh
      - name: Run clippy
        run: tools/clippy.sh
      - name: Run tests
        run: tools/buck2 test //crates/... //bin/... //go/...

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install DotSlash
        run: tools/ci/install-dotslash
      - name: Check generated Cargo manifests
        run: tools/autocargo --check
      - name: Run tests
        run: cargo test --workspace --locked

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Check generated third-party Go rules
        run: tools/gobuckify-remote --check
      - name: Vet and test with the go command
        working-directory: go
        run: |
          go vet ./...
          go test ./...
