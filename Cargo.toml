# @generated by tools/autocargo from the BUCK files. Do not edit.
[workspace]
members = ["bin/peppydb", "crates/bf-tree", "crates/bf-tree-circular-buffer", "crates/bf-tree-inner", "crates/bf-tree-mini-page", "crates/bf-tree-node-id", "crates/bf-tree-page", "crates/bf-tree-store", "crates/bf-tree-sync", "crates/engine", "crates/engine-wal", "crates/server", "crates/server-proto"]
# Buck2 input only; see third-party/rust/Cargo.toml.
exclude = ["third-party/rust"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
arc-swap = "1.9"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
libc = "0.2"
prost = "0.14"
prost-types = "0.14"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zerocopy = { version = "0.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
