[workspace]
members = ["bin/peppydb", "crates/peppydb-bftree"]
default-members = ["bin/peppydb"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
thiserror = "2"
zerocopy = { version = "0.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
