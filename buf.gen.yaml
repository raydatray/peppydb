# Go code generation. tools/gen-proto puts the plugins, built from the
# go.mod tool directives, on PATH, and passes the output directory.
# Rust code is generated by tools/protogen from buf's descriptor set.
version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=peppydb
  - local: protoc-gen-go-grpc
    out: .
    opt: module=peppydb
