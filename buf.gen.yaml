# Go code generation. tools/gen-proto puts the plugins, built from the
# go/go.mod tool directives, on PATH, and passes the output directory.
# Rust code is generated by tools/protogen from buf's descriptor set.
version: v2
plugins:
  - local: protoc-gen-go
    out: go
    opt: module=peppydb/go
  - local: protoc-gen-go-grpc
    out: go
    opt: module=peppydb/go
