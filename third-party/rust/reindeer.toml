# reindeer configuration. Paths are relative to this file.
third_party_dir = "."
# Download crates at build time (http_archive + sha256); nothing is vendored.
vendor = false
# Provide CARGO_PKG_* and similar variables like Cargo does. Some build
# scripts read them (for example serde_core reads CARGO_PKG_VERSION_PATCH).
cargo_env = true

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
##
## @generated by reindeer from third-party/rust/Cargo.toml. Do not edit.
## Run tools/buckify after changing Cargo.toml.
##
"""
