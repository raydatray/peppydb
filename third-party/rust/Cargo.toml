# Direct crates.io dependencies of first-party Rust code. This is the only
# place they are declared. After an edit, run `tools/buckify`, which resolves
# Cargo.lock, regenerates BUCK with reindeer, and regenerates the Cargo
# manifests.

[workspace]

[package]
name = "rust-third-party"
version = "0.0.0"
edition = "2024"
publish = false

# Cargo requires a target; reindeer ignores it.
[[bin]]
name = "top"
path = "top/main.rs"

[dependencies]
arc-swap = "1.9"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
futures-util = "0.3"
libc = "0.2"
# Pinned exactly: the API and on-disk types change before 1.0, and each
# upgrade is its own diff (plan 0025, decision 9).
openraft = { version = "=0.10.0", default-features = false, features = ["tokio-rt"] }
openraft-rt-sim = "=0.10.0"
openraft-rt-tokio = "=0.10.0"
prost = "0.14"
prost-types = "0.14"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zerocopy = { version = "0.8", features = ["derive"] }
